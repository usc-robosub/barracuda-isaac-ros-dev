version: '3.8'

services:
  barracuda_isaac_ros:
    build:
      context: .
      dockerfile: Dockerfile.barracuda_nvblox
      args:
        - USER_UID=${HOST_USER_UID:-1000}
        - USER_GID=${HOST_USER_GID:-1000}
    image: barracuda_isaac_ros:with-nvblox
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/home/admin/.Xauthority
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - USER=${USER}
      - ISAAC_ROS_WS=/workspaces/isaac_ros-dev
      - ROS_DOMAIN_ID=0
      - HOST_USER_UID=${HOST_USER_UID:-1000}
      - HOST_USER_GID=${HOST_USER_GID:-1000}
    volumes:
      # Mount the full repository/workspace so edits are visible at runtime
      - ./:/workspaces/isaac_ros-dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/home/admin/.Xauthority:rw
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    ipc: host
    privileged: true
    entrypoint: /usr/local/bin/scripts/workspace-entrypoint.sh
    tty: true

# Notes:
# - This compose file mirrors many of the runtime mounts and env vars used by
#   `run_dev.sh` so the container gets access to the same X11 socket, workspace
#   mount and time settings. Adjust HOST_USER_UID/HOST_USER_GID in your shell
#   if you want files copied to the image to be owned by your host user.
# - Build the image with `docker-compose build` then run `docker-compose up`.